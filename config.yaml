    outcome_marker_min_pixels: 800
    attacker_target_marker_enabled: true
    attacker_target_marker_region: {x: 996, y: 0, width: 112, height: 56}
    attacker_target_marker_hsv_lower: [115, 220, 220]
    attacker_target_marker_hsv_upper: [125, 255, 255]
    attacker_target_marker_min_pixels: 800
    # v0.4.5 addon marker: red=1, orange=2, white=3+ unique recent attackers.
