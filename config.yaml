  poll_interval: 0.15
  coord_interval: 0.50
  max_coord_jump_per_poll: 1.5
  mounted_coord_units_per_second: 0.75
  foot_coord_units_per_second: 0.45
  coord_jump_timing_margin: 0.25
  coord_feedback_timeout_seconds: 2.0
  coord_resync_confirm_steps: 3
  coord_resync_max_distance: 5.0
  stuck_check_window: 2
  stuck_min_progress: 0.025
  # Live Broken Pillar trap produced 0.02 coordinate OCR oscillation while the
  # character remained visibly wedged. Treat it as noise, not route progress.
  stuck_min_coord_delta: 0.03
  obstacle_back_duration: 0.35
  obstacle_strafe_duration: 0.55
  obstacle_turn_duration: 0.18
  obstacle_jump_duration: 0.08
  local_avoid_retry_seconds: 0.45
  obstacle_jump_first: true
  obstacle_detour_duration: 0.35
  obstacle_detour_max_duration: 0.65
  obstacle_detour_settle_duration: 0.0
  # Keep one escape direction long enough to avoid zigzag, then try the other
  # side once a genuinely wedged obstacle survives four bounded recoveries.
  obstacle_recovery_attempts_per_side: 4
  recovery_coord_interval: 0.15
  visual_stuck_window: 2
  target_recovery_limit: 3
  target_progress_timeout_seconds: 18.0
  target_progress_min_improvement: 0.08
  # Last resort only after the full progress timeout: get off the mount,
  # create clearance, turn around with bounded RMB pulses and leave on foot.
  hard_stuck_escape:
    enabled: true
    dismount_settle_seconds: 0.25
    back_seconds: 0.75
    turn_seconds: 1.95
    turn_pulse_seconds: 0.39
    forward_seconds: 0.90
    remount_delay_seconds: 2.0
    forward_waypoint_padding: 6
  path_blocked_cooldown_seconds: 90
  turn_duration: 0.22
  turn_in_place_duration: 0.35
  turn_in_place_alignment: -0.2
  turn_alignment_threshold: 0.97
  invert_turn_direction: true
  heading_control:
    enabled: true
    fallback_to_legacy: true
    max_heading_age_seconds: 0.60
    reset_after_seconds: 0.75
    # The full route uses a longer pure-pursuit target. Keep a modest deadband
    # and suppress only one-tick A/D rebounds instead of chasing every OCR/yaw
    # fluctuation.
    turn_engage_degrees: 18.0
    turn_release_degrees: 9.0
    pivot_degrees: 45.0
    positive_error_turn_key: A
    turn_rate_degrees_per_second: 92.0
    min_turn_pulse_seconds: 0.06
    max_turn_pulse_seconds: 0.35
    opposite_turn_lock_seconds: 2.50
    opposite_turn_engage_degrees: 50.0
  mouse_steering:
    enabled: true
    pixels_per_second:
      default: 420.0
      route: 420.0
      # Continuous combat target search should be visibly slow and smooth.
      combat: 300.0
      spirit: 300.0
      mining: 260.0
      local: 420.0
      recovery: 420.0
      hostile: 420.0
    step_interval_seconds: 0.012
    min_duration_seconds: 0.04
    max_duration_seconds: 0.40
    route_moving_max_duration_seconds: 0.10
    min_pixels: 2
    restore_cursor: true

route:
  locations: [162]
  ores: []
  mode: cyclic
  database_path: data/routes/generated/tanaris_terrain_coverage_cycle_v18_rail.json
  follow_route_loop: true
  polyline_following:
    enabled: true
    # About two seconds of mounted travel: long enough to smooth dense route
    # vertices without cutting the terrain-planned corridor into a blind chord.
    lookahead_distance: 1.50
    # The Broken Pillar bypass is a tight WMO corner. Preserve its dense
    # navmesh vertices locally so the ordinary 1.50 lookahead cannot chord
    # back through the structure.
    lookahead_overrides:
      - {start_index: 9, end_index: 29, distance: 0.25}
      - {start_index: 35, end_index: 155, distance: 0.25}
      # V15 removes the whole Chasm spur. Preserve the short terrain bridge,
      # then shift downstream V13 overrides by the 22 removed waypoints.
      - {start_index: 183, end_index: 190, distance: 0.25}
      # V16 replaces two southwest contact points with an eleven-point
      # terrain-planned bypass north of the wreckage at 30.65,73.82.
      - {start_index: 204, end_index: 219, distance: 0.25}
      - {start_index: 257, end_index: 276, distance: 0.25}
      - {start_index: 389, end_index: 403, distance: 0.25}
    corridor_radius: 1.50
    backward_tolerance: 0.25
    max_forward_advance: 24.0
    pass_tolerance: 0.05
    projection_search_backward_segments: 3
    projection_search_forward_segments: 32
  reached_distance: 0.65
  entry:
    enabled: true
    strategy: navmesh_dynamic
    dynamic_failure_mode: advisory
    # Entry waypoints are 0.5 coordinate units apart. A 0.08 point-radius made
    # mounted movement overshoot, turn back and circle; use the validated
    # pass-through tolerance while the final rail projection remains bounded.
    reached_distance: 0.25
    waypoint_pass_through_distance: 0.25
    max_anchor_distance: 2.0
    # The route loop is already terrain/navmesh planned. Replanning a second
    # short mmap corridor to every route waypoint produced close alternating
    # steering points and the wide live zigzags seen in v0.8.9.
    guide_route_segments: false
    guidance_failure_mode: advisory
    guidance_replan_distance: 0.55
    navmesh_profiles:
      "102":
        manifest_path: data/extracted_client_data/desolace_v2/manifest.json
        adt_dir: data/extracted_client_data/desolace_v2/world/maps/Kalimdor
        mmap_dir: data/server_navigation/ac_data_v20/mmaps
        map_id: 1
        candidate_count: 32
        waypoint_spacing_yards: 25.0
        max_nav_snap_yards: 40.0
        max_nav_vertical_yards: 80.0
        max_expansions: 200000
        min_clearance_cells: 0.0
        terrain:
          soft_slope_degrees: 15.0
          hard_slope_degrees: 35.0
          slope_weight: 8.0
          roughness_weight: 0.08
          clearance_cells: 3.0
          clearance_weight: 5.0
      "162":
        manifest_path: data/extracted_client_data/tanaris_corrected/manifest.json
        adt_dir: data/extracted_client_data/tanaris_corrected/world/maps/Kalimdor
        mmap_dir: data/server_navigation/ac_data_v20/mmaps
        map_id: 1
        hazards_path: data/routes/live_hazards/tanaris.json
        candidate_count: 32
        waypoint_spacing_yards: 25.0
        max_nav_snap_yards: 40.0
        max_nav_vertical_yards: 80.0
        max_expansions: 200000
        min_clearance_cells: 0.0
        terrain:
          soft_slope_degrees: 15.0
          hard_slope_degrees: 35.0
          slope_weight: 8.0
          roughness_weight: 0.08
          clearance_cells: 3.0
          clearance_weight: 5.0
  tracking_radius_coord: 1.15
  blocked_waypoint_forward_padding: 2
  absence_confirm_steps: 2
  dark_exclusion_enabled: false
  dark_exclude_distance_coord: 0.25
  absence_cooldown_seconds: 300
  permanent_exclusions_path: data/permanent_exclusions_tanaris.json

