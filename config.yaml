mining:
  enabled: false
  route_live_enabled: false
  reached_distance: 0.20
  # Retain the narrow ordinary/unconfirmed player admission radius. Tooltip-
  # confirmed DB identity uses the separate search envelope below.
  candidate_match_distance_coord: 0.70
  # The ordinary 0.70 player radius is an admission guard, not a DB identity
  # radius. Once the native tooltip proves live ore/type, search the small V7
  # node list across the full observed minimap envelope. Access ownership still
  # requires the existing <=0.18 route attachment, so this adds no detour,
  # screenshot, cursor hover or wait by itself.
  # Zoom-12 live telemetry shows a full minimap radius of about 2.34%/3.38%
  # of Tanaris on X/Y. Scan the complete visible envelope; 139-node matching
  # remains sub-millisecond and access-plan attachment still gates movement.
  tooltip_confirmed_database_search_distance_coord: 4.0
  marker_database_match_distance_coord: 0.55
  require_minimap_tooltip_confirmation: true
  tooltip_confirmed_relaxed_match_enabled: true
  # A native tooltip proves that ore is live, but movement still requires a
  # compatible/admissible DB spawn. Never steer from a synthetic projection.
  tooltip_confirmed_unmatched_enabled: false
  tooltip_confirmed_unmatched_max_distance_coord: 0.75
  minimap_tooltip_probe:
    enabled: true
    # If the character already covers the icon, a DB spawn within this tiny
    # radius may request a read-only hover at the exact minimap center. Only a
    # native ore tooltip can turn that offline hint into a live candidate.
    center_fallback_enabled: true
    center_fallback_max_distance_coord: 0.08
    settle_seconds: 0.10
    timeout_seconds: 0.70
    retry_cooldown_seconds: 2.0
    confirmation_hold_seconds: 0.75
    release_cursor_point: {x: 1280, y: 170}
  marker_bearing_enabled: true
  marker_bearing_min_pixels: 5
  marker_bearing_min_alignment: 0.20
  marker_bearing_weight: 2.0
  marker_radial_weight: 1.0
  direct_marker_intercept_enabled: true
  # Empirical zoom-12 calibration from 108 same-track live coordinate/pixel
  # pairs: median 0.0200 map-%/px on X and 0.02894 on Y. With the current
  # 293x278 crop and 0.42 sensor radius this is 2.34% / 3.38%. The previous
  # 0.72/1.09 values underestimated every final marker correction by ~3.1x.
  marker_tracking_radius_x_coord: 2.34
  marker_tracking_radius_y_coord: 3.38
  direct_marker_intercept_max_node_delta_coord: 1.35
  # A native-tooltip-confirmed icon proves live presence. A matched GatherMate
  # coordinate is the fixed historical successful interaction anchor; the live
  # marker remains authoritative for identity and post-arrival facing only.
  direct_node_intercept_first_enabled: false
  direct_marker_world_search_distance_coord: 0.04
  # Ordinarily world search waits until the live ore is under the player
  # marker. Six minimap pixels is the final visible centering gate; if the
  # player icon hides the ore inside the wider occlusion radius, hover the
  # exact minimap center and require the native ore tooltip there. The bounded
  # anchor-local exception below exists only after the fixed DB anchor was
  # already reached and still cannot click without native world evidence.
  direct_marker_world_scan_radius_pixels: 6
  centered_marker_radius_pixels: 6
  centered_marker_occlusion_radius_pixels: 18
  # If the fixed GatherMate interaction anchor has already been reached and a
  # modest 18-24 px residual contradicts an immediately adjacent world vein,
  # stay stopped and let the candidate-only model seek native tooltip/pickaxe
  # authority first. A short miss falls back to the original single residual
  # correction; model evidence alone still cannot click.
  anchor_local_world_validation_enabled: true
  anchor_local_world_validation_radius_pixels: 24
  anchor_local_world_validation_seconds: 3.0
  center_tooltip_probe:
    settle_seconds: 0.12
    timeout_seconds: 0.90
  # A DB-backed node at its anchor can be hidden by the player icon. If the
  # minimap-center tooltip then vanishes, require bounded world-model plus
  # native world-hover authority instead of cooling the node immediately.
  center_tooltip_world_scan_fallback_enabled: true
  direct_marker_world_scan_candidate_distance_coord: 0.08
  lost_marker_world_scan_distance_coord: 0.10
  lost_marker_world_scan_radius_pixels: 36
  world_scan_camera_reset_enabled: true
  world_scan_camera_reset_key: F7
  world_scan_camera_reset_tap_seconds: 0.04
  # Full-route live mining may leave the rail only through a precomputed safe
  # terrain access plan. Brightness alone is not proof of a traversable line.
  require_access_plan_for_route_live: true
  # A plan is safe only from its rail attachment. If the icon is detected
  # earlier, keep following the rail and acquire it again near that attachment
  # instead of drawing an unplanned chord across a hill.
  # V0.8.17 live rail cross-track reached 0.265 at a valid Small Thorium
  # attachment; 0.18 rejected it despite native tooltip/type and a safe plan.
  access_attachment_max_distance_coord: 0.35
  access_option_retry_enabled: true
  max_access_option_retries: 1
  intercept_progress_coord: 0.02
  world_search_distance_coord: 0.08
  # Coordinate OCR is sampled while mounted movement is continuous. Hand off
  # from terrain access to the visual search as soon as a confirmed candidate
  # is reached or the travelled segment crosses this radius; do not finish a
  # side waypoint after already passing the spawn coordinate.
  candidate_handoff_distance_coord: 0.08
  # Coarse access and node travel remain continuous. Coordinate OCR runs every
  # The configured 0.5-second OCR request produced 0.735s median / 1.214s p95
  # accepted samples in v0.8.18, with 12.6yd p95 and 16.02yd max mounted travel
  # between them. Brake inside 19 physical yards (observed max plus the 2.5yd
  # arrival tolerance), then use a local 0.15s stopped-coordinate refresh,
  # align in place and issue one speed-calibrated W burst. This is an empirical
  # braking envelope, not a mandatory wait point; the burst is never micro-stepped.
  # The Tanaris dimensions come from the extracted client map manifest; mounted
  # speed is the 16.77 yd/s median of 369 clean v0.8.14 telemetry segments.
  final_database_approach:
    enabled: true
    map_width_yards: 6900.0
    map_height_yards: 4600.0
    trigger_distance_yards: 19.0
    # DB-anchor arrival is only the handoff to live-marker centering, not click
    # authority. RUN1 produced a healthy 2.85 yd residual after one mounted
    # impulse; accept that instead of converting it into a false hard failure.
    arrival_tolerance_yards: 3.5
    # Only after the one non-repeatable W burst, allow a near-anchor handoff to
    # tooltip-gated world scan. Initial arrival remains strict at 3.5 yd.
    post_burst_world_scan_tolerance_yards: 6.0
    mounted_speed_yards_per_second: 16.8
    foot_speed_yards_per_second: 7.0
    min_burst_seconds: 0.05
    # Stop slightly short of the coordinate and let the live-marker stage close
    # the residual. RUN1 showed that aiming for exact zero could overshoot the
    # DB anchor by 6.8 yd because OCR, yaw and movement are not atomic.
    burst_stop_short_yards: 1.0
    # Mounted braking remains short. A dismounted post-combat approach needs up
    # to 2.36 s across the same 19 yd envelope; sharing the mounted cap caused
    # a deterministic foot miss from 14.4 yd.
    mounted_max_burst_seconds: 1.15
    foot_max_burst_seconds: 2.40
    precision_coord_interval_seconds: 0.15
    feedback_settle_seconds: 0.35
    feedback_timeout_seconds: 1.75
  bright_confirm_frames: 2
  marker_track_max_jump_pixels: 24
  marker_track_missing_frames: 3
  # Four consecutive misses suppress single-frame CV loss. A tooltip-confirmed
  # marker that is still absent after this gate is treated as gathered by
  # another player and receives the normal failure/spatial cooldown.
  intercept_marker_missing_frames: 4
  continue_coordinate_approach_after_marker_loss: true
  cooldown_seconds: 180
  failure_cooldown_seconds: 300
  # Cool both the stable DB spawn and the last live marker projection. The
  # wider same-ore footprint prevents projection jitter from reopening the
  # identical physical vein after one bounded failed transaction.
  failure_spatial_cooldown_radius_coord: 0.65
  dark_failure_cooldown_seconds: 86400
  max_total_seconds: 60
  final_world_scan_distance_coord: 0.06
  max_intercept_seconds: 30
  max_face_node_seconds: 4.0
  face_node_timeout_starts_world_scan: true
  intercept_no_progress_seconds: 4.0
  intercept_progress_pixels: 3
  intercept_stall_world_scan_distance_coord: 0.08
  intercept_stall_world_scan_radius_pixels: 52
  max_world_scan_seconds: 16
  dark_target_confirm_frames: 2
  scan_region: {x: 760, y: 260, width: 940, height: 640}
  scan_step: 32
  scan_max_points: 72
  front_probe_enabled: true
  front_probe_center_x_fraction: 0.50
  # Search the visible ground in front/left/right before probing underfoot.
  front_probe_y_fractions: [0.50, 0.56, 0.62, 0.44, 0.68, 0.74]
  front_probe_x_offsets: [0, -32, 32, -64, 64, -96, 96]
  front_probe_max_points: 42
  salient_probe_enabled: true
  salient_probe_region: {x: 220, y: 180, width: 1760, height: 950}
  salient_probe_hsv_lower: [35, 80, 90]
  salient_probe_hsv_upper: [115, 255, 255]
  salient_probe_min_area: 24
  # RUN5 showed a close Small Thorium vein occupying about 270k HSV pixels.
  # Keep the candidate-only salient fallback useful at final mining range.
  salient_probe_max_area: 300000
  salient_probe_close_kernel: 5
  salient_probe_offsets: [0, -22, 22]
  salient_probe_max_points: 24
  ore_world_detector:
    enabled: true
    prewarm: true
    model_path: external_data/models/ore_world_candidate.pt
    imgsz: 640
    confidence: 0.35
    # Ore sparkle animation moved the same live Gold vein from 0.331 to 0.747
    # confidence. Re-run candidate inference while the bounded hover scan is
    # active instead of trusting one unlucky animation frame.
    refresh_interval_seconds: 0.75
    refresh_point_dedupe_pixels: 20
    model_iou_threshold: 0.45
    dedupe_iou_threshold: 0.45
    model_max_detections: 12
    max_candidates: 3
    min_area_fraction: 0.0005
    # Close post-F7 ore can occupy 12-14% of the frame. Hover/tooltip evidence
    # still authorizes every click, so accepting large proposals is safe.
    max_area_fraction: 0.18
    # Candidate boxes never authorize clicks without a native mining cursor.
    # RUN1 proved the old lower-center exclusion also discarded a real close20
    # vein (0.905 confidence), so retain candidates and let cursor evidence
    # reject the player model.
    self_exclusion_enabled: false
    self_exclusion_center_x_fraction: 0.50
    self_exclusion_center_y_fraction: 0.62
    self_exclusion_width_fraction: 0.14
    self_exclusion_height_fraction: 0.26
    probe_offset_fractions: [0.0, -0.20, 0.20]
    device: 0
  hover_delay: 0.08
  cursor_baseline_point: {x: 1280, y: 170}
  require_mining_tooltip: true
  require_cursor_change: true
  require_classified_cursor_when_calibrated: false
  tooltip_only_click_enabled: true
  cursor_pixel_fallback_enabled: true
  cursor_template_fallback_enabled: true
  cursor_template_min_score: 0.62
  cursor_template_margin: 0.04
  cursor_color_fallback_enabled: false
  cursor_only_click_enabled: true
  cursor_only_confirm_frames: 3
  cursor_candidate_extra_settle_enabled: true
  cursor_candidate_extra_settle_frames: 4
  cursor_candidate_extra_settle_seconds: 0.10
  # RUN2 repeatedly had a native pickaxe cursor and Iron tooltip on the exact
  # model proposal, but discarded that authority to recenter the world view.
  # Click the already-confirmed screen point directly; WoW handles interaction
  # facing, and the normal gather verification still rejects a failed click.
  world_target_face_enabled: false
  # Retained for offline experiments if facing is re-enabled. Direct
  # screen-space X defines the correction; RUN8 proved route inversion wrong.
  world_target_face_invert_turn_direction: false
  world_target_center_x_fraction: 0.50
  world_target_face_deadzone_fraction: 0.055
  world_target_face_min_seconds: 0.05
  world_target_face_max_seconds: 0.18
  world_target_face_seconds_per_screen_width: 0.55
  right_click_duration: 0.05
  gather_wait_seconds: 3.0
  verify_clear_frames: 2
  verify_timeout_seconds: 6.0
  verify_require_hover_clear: true
  resume_projection_reached_distance: 0.45
  tooltip_region: {x: 2380, y: 1010, width: 180, height: 130}
