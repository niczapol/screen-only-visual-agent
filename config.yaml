    attacker_count_two_hsv_lower: [10, 220, 220]
    attacker_count_two_hsv_upper: [22, 255, 255]
    attacker_count_three_hsv_lower: [0, 0, 225]
    attacker_count_three_hsv_upper: [179, 45, 255]
    threat_hp_window_seconds: 5.0
    outgoing_hit_marker_region: {x: 1108, y: 0, width: 112, height: 56}
    outgoing_hit_marker_hsv_lower: [55, 220, 220]
    outgoing_hit_marker_hsv_upper: [65, 255, 255]
    facing_error_marker_region: {x: 1338, y: 0, width: 112, height: 56}
    facing_error_marker_hsv_lower: [85, 220, 220]
    facing_error_marker_hsv_upper: [95, 255, 255]
    out_of_range_marker_region: {x: 1452, y: 0, width: 112, height: 56}
    out_of_range_marker_hsv_lower: [8, 220, 220]
    out_of_range_marker_hsv_upper: [20, 255, 255]
    legacy_outgoing_damage_confirmation_enabled: false
    legacy_facing_error_confirmation_enabled: false
    engage_on_nameplate: false
    target_frame_detector_enabled: true
    target_frame_starts_combat: false
    confirmed_target_frame_region: {x: 300, y: 15, width: 390, height: 120}
    target_red_health_min_fill_ratio: 0.60
    player_health_region: {x: 155, y: 70, width: 190, height: 25}
    player_health_hsv_lower: [35, 60, 50]
    player_health_hsv_upper: [95, 255, 255]
    player_health_column_min_pixels: 4
    attack_keys: ["E"]
    attack_interval: 0.20
    periodic_keys: ["X"]
    periodic_interval: 15.0
    # Q is allowed only after an E-triggered outgoing hit has locked facing.
    aligned_periodic_keys: ["Q"]
    aligned_periodic_interval: 5.0
    # F is serialized ahead of X/Q/E whenever visible HP is at or below 20%.
    low_health_priority_keys: ["F"]
    low_health_priority_threshold: 0.20
    low_health_priority_interval: 15.0
    attack_tap_duration: 0.06
    combat_key_min_interval: 0.12
    range_approach_duration: 0.35
    range_approach_cooldown_seconds: 0.55
    face_turn_duration: 0.15
    face_center_deadzone_px: 35
    damage_timeout_seconds: 4.0
    # Hold the confirmed target bearing through ordinary three-second stuns;
    # combat-marker clear/loot releases it sooner, while this is the fail-safe.
    target_lock_no_hit_seconds: 8.0
    # A selected frame/nameplate alone cannot hold a health-drop-only episode
    # forever. Ongoing HP loss or any authoritative addon combat marker resets it.
    stale_soft_target_seconds: 6.0
    face_search_cooldown_seconds: 1.0
    face_search_turn_key: "D"
    continuous_face_search_enabled: true
    # E owns target acquisition/attack. F8 cycling selected unrelated distant mobs
    # in the v0.8.16 live run and bypassed the serialized F/V > X > Q > E contract.
    attacker_target_selection_enabled: false
    attacker_target_cycle_key: F8
    attacker_target_cycle_interval: 0.35
    target_interact_facing_enabled: false
    target_interact_key: G
    target_interact_cooldown_seconds: 0.45
    target_interact_probe_delay_seconds: 0.35
    nameplate_facing_enabled: false
    nameplate_face_turn_duration: 0.08
    # The 190 px visible HP bar quantizes between 0.963 and 0.947 (1.579%) on
    # unchanged health. Stay above that measured jitter; the addon combat marker
    # remains authoritative and larger visible drops still provide fallback.
    health_drop_latch_threshold: 0.02
    mounted_escape_enabled: true
    mounted_escape_min_health: 0.55
    # Stop trying to outrun combat when two attackers / dangerous HP loss are
    # visible, or when one attacker has chased the mount for too long.
    mounted_escape_max_active_seconds: 12.0
    mounted_escape_progress_timeout_seconds: 3.0
    mounted_escape_min_coord_delta: 0.015
    face_search_turn_180_duration: 0.18
    face_search_turn_90_duration: 0.18
